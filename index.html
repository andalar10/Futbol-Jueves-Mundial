<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fútbol Jueves Mundial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10151a;
    --surface:#1a2129;
    --surface-2:#212b35;
    --line:#2a3542;
    --text:#eef2f5;
    --text-dim:#8ea0ac;
    --pitch:#2f9e56;
    --pitch-dark:#1d6b3a;
    --blue:#3568c4;
    --red:#c23b3b;
    --amber:#e2a63b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #17222055 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:90px;
  }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.03em;}

  header.top{
    padding:22px 18px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#151c22,#10151a);
    position:sticky; top:0; z-index:20;
  }
  header.top .stripe{
    height:4px; width:46px; background:var(--pitch); border-radius:3px; margin-bottom:10px;
  }
  header.top h1{font-size:22px; margin:0; font-weight:700;}
  header.top p{margin:4px 0 0; color:var(--text-dim); font-size:13px;}

  main{max-width:640px; margin:0 auto; padding:16px;}

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    display:flex; background:#151c22; border-top:1px solid var(--line);
    max-width:640px; margin:0 auto;
  }
  @media(min-width:640px){ nav.tabs{ left:50%; transform:translateX(-50%);} }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-dim);
    font-family:'Inter'; font-size:11.5px; font-weight:600;
    padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer;
  }
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button.active{color:var(--pitch);}

  .view{display:none;}
  .view.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.04em;}
  label:first-child{margin-top:0;}
  input[type=date], input[type=text], textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:11px 12px; font-family:'Inter'; font-size:14.5px;
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, textarea:focus{outline:2px solid var(--pitch); outline-offset:1px;}

  .filebtn{
    border:1.5px dashed var(--line); border-radius:12px; padding:22px 14px;
    text-align:center; color:var(--text-dim); font-size:13.5px; cursor:pointer;
    background:var(--surface-2); transition:border-color .15s;
  }
  .filebtn:hover{border-color:var(--pitch);}
  .filebtn input{display:none;}
  .filebtn .big{font-size:26px; display:block; margin-bottom:4px;}

  .preview-img{max-width:100%; border-radius:10px; margin-top:10px; display:none; border:1px solid var(--line);}

  button.primary{
    width:100%; background:var(--pitch); color:#08160c; border:none; border-radius:10px;
    padding:13px; font-weight:700; font-size:14.5px; font-family:'Inter'; cursor:pointer;
    margin-top:16px;
  }
  button.primary:disabled{background:#33403a; color:#7c8a82; cursor:not-allowed;}
  button.secondary{
    width:100%; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:10px;
    padding:11px; font-weight:600; font-size:13.5px; cursor:pointer; margin-top:8px;
  }
  button.ghost{
    background:none; border:none; color:var(--pitch); font-weight:600; font-size:13px; cursor:pointer; padding:6px 0;
  }

  .status{font-size:13px; color:var(--text-dim); margin-top:10px; display:flex; align-items:center; gap:8px;}
  .spinner{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--pitch); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .roster{margin-top:14px;}
  .team-block{margin-bottom:14px;}
  .team-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dot{width:10px; height:10px; border-radius:50%;}
  .dot.blue{background:var(--blue);} .dot.red{background:var(--red);} .dot.other{background:var(--amber);}
  .team-head span{font-family:'Oswald'; text-transform:uppercase; font-weight:600; font-size:13.5px; letter-spacing:.04em;}

  .prow{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:9px; padding:8px 10px; margin-bottom:6px;
  }
  .prow input[type=text]{flex:1; background:none; border:none; padding:2px; font-size:14px;}
  .prow select{background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:6px; font-size:12px; padding:5px 6px;}
  .prow button{background:none; border:none; color:#8a5555; font-size:16px; cursor:pointer; padding:2px 4px;}

  .diff-box{
    background:#221a12; border:1px solid #4a3a1f; border-radius:10px; padding:12px; margin-top:14px;
  }
  .diff-box h3{color:var(--amber); font-size:13px; margin:0 0 10px;}
  .sub-row{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:6px 0; border-bottom:1px solid #33281755;}
  .sub-row:last-child{border-bottom:none;}
  .sub-row .out{color:#e08787; font-weight:600;}
  .sub-row .arrow{color:var(--text-dim);}
  .sub-row .in{color:#8fd6a3; font-weight:600;}
  .sub-row select{margin-left:auto; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-size:12px;}

  /* Historial */
  .partido-card{padding:0; overflow:hidden;}
  .p-head{padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .p-head .fecha{font-family:'Oswald'; font-weight:600; font-size:15px; text-transform:uppercase;}
  .p-head .meta{color:var(--text-dim); font-size:12px; margin-top:2px;}
  .badges{display:flex; gap:6px; margin-top:8px;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; letter-spacing:.02em;}
  .badge.ok{background:#1d6b3a44; color:#8fd6a3;}
  .badge.off{background:#2a2a2a; color:#6b7680;}

  .marcador-input{display:flex; align-items:center; gap:10px; margin-top:6px;}
  .marcador-input input{
    width:56px; text-align:center; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:11px 6px; font-family:'Oswald'; font-size:18px; font-weight:600;
  }
  .marcador-guion{color:var(--text-dim); font-family:'Oswald'; font-size:18px;}
  .marcador-chip{
    display:inline-flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:20px; padding:4px 12px; font-family:'Oswald'; font-size:13px; font-weight:600; margin-top:8px;
  }
  .p-head .chev{color:var(--text-dim); transition:transform .2s;}
  .p-body{display:none; padding:0 16px 16px; border-top:1px solid var(--line);}
  .p-body.open{display:block;}
  .conv-text{background:var(--surface-2); border-left:3px solid var(--pitch); padding:10px 12px; border-radius:0 8px 8px 0; font-size:13.5px; font-style:italic; color:#d7dee2; margin:12px 0;}
  .version-tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; margin-right:6px;}
  .version-tag.valid{background:#1d6b3a44; color:#8fd6a3;}
  .version-tag.invalid{background:#3a3a3a; color:var(--text-dim); text-decoration:line-through;}
  .roster-mini{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .version-img{width:100%; max-width:260px; display:block; border-radius:8px; margin:10px 0; border:1px solid var(--line);}
  .version-actions{display:flex; gap:8px; margin-top:10px;}
  .version-actions button{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 6px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter';
  }
  .version-actions button:disabled{opacity:.5; cursor:not-allowed;}
  .version-status{font-size:12px; color:var(--text-dim); margin-top:8px; display:flex; align-items:center; gap:6px;}
  .chip{font-size:12px; background:var(--surface-2); border:1px solid var(--line); padding:4px 9px; border-radius:20px;}

  .empty{text-align:center; color:var(--text-dim); padding:50px 20px; font-size:13.5px;}
  .empty .big{font-size:34px; display:block; margin-bottom:10px;}

  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .n{font-family:'Oswald'; font-weight:700; color:var(--amber); font-size:16px;}

  .toolbar{display:flex; gap:8px; margin-top:4px;}
  .toolbar button{flex:1;}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:var(--pitch); color:#08160c; padding:10px 18px; border-radius:30px;
    font-weight:600; font-size:13.5px; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<header class="top">
  <div class="stripe"></div>
  <h1>Fútbol Jueves Mundial</h1>
  <p>Convocatorias, alineaciones y bajas del grupo</p>
</header>

<main>

  <!-- VISTA: NUEVO PARTIDO -->
  <section id="view-nuevo" class="view active">
    <div class="card">
      <label>Fecha del partido</label>
      <input type="date" id="f-fecha">

      <label>Texto de la convocatoria</label>
      <textarea id="f-convocatoria" placeholder="Ej: Convocatoria para el jueves, se ruega puntualidad..."></textarea>

      <label>Foto de la alineación</label>
      <div class="filebtn" id="filebtn">
        <span class="big">📷</span>
        <span id="filebtn-label">Toca para subir la captura</span>
        <input type="file" id="f-imagen" accept="image/*">
      </div>
      <img id="preview" class="preview-img">

      <label>Resultado (opcional, puedes rellenarlo más tarde)</label>
      <div class="marcador-input">
        <span class="dot blue"></span>
        <input type="number" id="f-goles-azul" min="0" placeholder="–">
        <span class="marcador-guion">–</span>
        <input type="number" id="f-goles-rojo" min="0" placeholder="–">
        <span class="dot red"></span>
      </div>

      <div id="status" class="status" style="display:none;"></div>

      <div id="roster-editor" class="roster" style="display:none;"></div>
      <div id="diff-editor"></div>

      <button class="primary" id="btn-guardar" disabled>Guardar partido</button>
    </div>
  </section>

  <!-- VISTA: HISTORIAL -->
  <section id="view-historial" class="view">
    <div class="toolbar" style="margin-bottom:8px;">
      <button class="secondary" id="btn-export">⬇ Exportar JSON</button>
      <button class="secondary" id="btn-import">⬆ Importar JSON</button>
      <input type="file" id="f-import" accept="application/json" style="display:none;">
    </div>
    <button class="secondary" id="btn-generar-libro" style="margin-bottom:14px;">📖 Generar libro (PDF)</button>
    <div id="status-libro" class="status" style="display:none;"></div>
    <div id="historial-list"></div>
  </section>

  <!-- VISTA: ESTADÍSTICAS -->
  <section id="view-stats" class="view">
    <div class="card">
      <h3 style="margin-top:0; font-size:14px; color:var(--text-dim);">Más partidos jugados</h3>
      <div id="stats-jugados"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0; font-size:14px; color:var(--text-dim);">Más victorias</h3>
      <div id="stats-victorias"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0; font-size:14px; color:var(--text-dim);">Máximos goleadores</h3>
      <div id="stats-goleadores"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0; font-size:14px; color:var(--text-dim);">Tarjetas</h3>
      <div id="stats-tarjetas"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0; font-size:14px; color:var(--text-dim);">Bajas por jugador</h3>
      <div id="stats-bajas"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0; font-size:14px; color:var(--text-dim);">Veces que entra de suplente</h3>
      <div id="stats-altas"></div>
    </div>
  </section>

</main>

<nav class="tabs">
  <button class="tab-btn active" data-view="nuevo"><span class="ic">➕</span>Nuevo</button>
  <button class="tab-btn" data-view="historial"><span class="ic">📋</span>Historial</button>
  <button class="tab-btn" data-view="stats"><span class="ic">📊</span>Estadísticas</button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- Conexión a Supabase ---------- */
const SUPABASE_URL = 'https://qqmxxpbwvfalynltnpun.supabase.co';
// Clave "anon"/publishable: está pensada para ir en el cliente, no es secreta.
// El acceso real lo controlan las políticas RLS del proyecto.
const SUPABASE_ANON_KEY = 'sb_publishable_EunJ0PMxSQMuScN5W5OXGA_1-MCKn__';
let supabaseClient = null;
try{
  if(!window.supabase) throw new Error('La librería de Supabase no se cargó (¿sin conexión a internet?)');
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(err){
  console.error('No se pudo inicializar Supabase:', err);
}

function supabaseListo(){
  if(!supabaseClient){
    toast('⚠️ Sin conexión a la base de datos');
    return false;
  }
  return true;
}

/* ---------- Estado (caché local hidratada desde Supabase) ---------- */
let partidos = []; // se rellena al cargar la página, ver cargarDesdeSupabase()
let extraccionActual = null; // {equipos:[{nombre,color,jugadores:[{nombre,posicion}]}]}
let imagenUrlPendiente = null;
let cambiosPropuestos = []; // para el diff antes de guardar

async function cargarDesdeSupabase(){
  if(!supabaseListo()) return;
  const { data, error } = await supabaseClient
    .from('partidos')
    .select('*, alineaciones(*, jugadores_alineacion(*), cambios(*)), estadisticas_partido_jugador(*)')
    .order('fecha', { ascending: false });
  if(error){
    console.error(error);
    toast('Error al cargar datos de Supabase');
    return;
  }
  partidos = (data || []).map(p => ({
    id: p.id,
    fecha: p.fecha,
    convocatoria: {
      texto: p.convocatoria_texto || '',
      fecha_mensaje: p.convocatoria_fecha_mensaje,
      es_borrador: p.es_borrador
    },
    resultado: {
      golesAzul: p.goles_azul !== undefined ? p.goles_azul : null,
      golesRojo: p.goles_rojo !== undefined ? p.goles_rojo : null
    },
    alineaciones: (p.alineaciones || [])
      .sort((a,b)=>a.version-b.version)
      .map(a => ({
        id: a.id,
        version: a.version,
        valida: a.valida,
        fecha_mensaje: a.fecha_mensaje,
        imagen_path: a.imagen_path,
        imagen_url: a.imagen_url,
        jugadores: (a.jugadores_alineacion || []).map(j => ({nombre:j.nombre, posicion:j.posicion, equipo:j.equipo})),
        cambios_respecto_anterior: (a.cambios || []).map(c => ({jugador_baja:c.jugador_baja, jugador_entra:c.jugador_entra}))
      })),
    estadisticas: (p.estadisticas_partido_jugador || []).map(e => ({
      jugador: e.jugador,
      minutosJugados: e.minutos_jugados,
      goles: e.goles,
      tarjetaAmarilla: e.tarjeta_amarilla,
      tarjetaRoja: e.tarjeta_roja
    }))
  }));
}

/* ---------- Estadísticas por jugador y partido (minutos/goles/tarjetas) ---------- */

// Une los jugadores de TODAS las versiones de un partido (aunque hayan sido
// dados de baja y no estén en la alineación vigente), con su equipo/posición
// más reciente conocida.
function jugadoresUnicosPartido(partido){
  const mapa = new Map();
  [...partido.alineaciones].sort((a,b)=>a.version-b.version).forEach(a=>{
    a.jugadores.forEach(j=>{
      mapa.set(j.nombre, {nombre:j.nombre, equipo:j.equipo, posicion:j.posicion});
    });
  });
  return [...mapa.values()];
}

// Reparte 60 minutos a partes iguales entre las versiones de alineación del
// partido (una versión = un tramo del partido) y suma los tramos en los que
// aparece cada jugador. Si solo hay una versión, todos juegan los 60 minutos.
function calcularMinutosAutomaticos(partido){
  const versiones = [...partido.alineaciones].sort((a,b)=>a.version-b.version);
  const n = versiones.length || 1;
  const segmento = 60 / n;
  const minutos = {};
  versiones.forEach(v=>{
    v.jugadores.forEach(j=>{
      minutos[j.nombre] = (minutos[j.nombre] || 0) + segmento;
    });
  });
  Object.keys(minutos).forEach(k => minutos[k] = Math.round(minutos[k]));
  return minutos;
}

// Estadísticas "efectivas" por jugador para un partido: lo guardado en
// Supabase si existe, o si no, el valor automático (minutos calculados, 0
// goles, sin tarjetas).
function estadisticasEfectivasPartido(partido){
  const guardadas = {};
  (partido.estadisticas || []).forEach(e => guardadas[e.jugador] = e);
  const minutosAuto = calcularMinutosAutomaticos(partido);
  return jugadoresUnicosPartido(partido).map(j => {
    const g = guardadas[j.nombre];
    return {
      nombre: j.nombre,
      equipo: j.equipo,
      posicion: j.posicion,
      minutosJugados: g ? g.minutosJugados : (minutosAuto[j.nombre] ?? 60),
      goles: g ? g.goles : 0,
      tarjetaAmarilla: g ? g.tarjetaAmarilla : false,
      tarjetaRoja: g ? g.tarjetaRoja : false,
      esAutomatico: !g
    };
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- Navegación de pestañas ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view === 'historial'){ await cargarDesdeSupabase(); renderHistorial(); }
    if(btn.dataset.view === 'stats'){ await cargarDesdeSupabase(); renderStats(); }
  });
});

/* fecha por defecto: hoy */
document.getElementById('f-fecha').valueAsDate = new Date();

/* ---------- Subida de imagen + llamada a la API de Claude (visión) ---------- */
const filebtn = document.getElementById('filebtn');
const fInput = document.getElementById('f-imagen');
filebtn.addEventListener('click', ()=> fInput.click());

fInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  document.getElementById('preview').src = URL.createObjectURL(file);
  document.getElementById('preview').style.display = 'block';
  document.getElementById('filebtn-label').textContent = file.name;

  const statusEl = document.getElementById('status');
  statusEl.style.display = 'flex';
  statusEl.innerHTML = '<div class="spinner"></div> Subiendo imagen...';

  try{
    const blob = await comprimirImagenBlob(file, 900, 0.75);
    const fecha = document.getElementById('f-fecha').value || 'sin-fecha';
    const ruta = `${fecha}/${Date.now()}.jpg`;
    if(!supabaseListo()) throw new Error('Sin conexión a Supabase');
    const { error: errSubida } = await supabaseClient.storage.from('alineaciones').upload(ruta, blob, {contentType:'image/jpeg', upsert:true});
    if(errSubida) throw errSubida;
    const { data: urlData } = supabaseClient.storage.from('alineaciones').getPublicUrl(ruta);
    imagenUrlPendiente = urlData.publicUrl;
    await extraerAlineacion({image_url: imagenUrlPendiente});
  }catch(err){
    console.error(err);
    statusEl.innerHTML = '⚠️ No se pudo subir la imagen. Añade los jugadores a mano abajo.';
    imagenUrlPendiente = null;
    extraccionActual = {equipos:[{color:'azul', jugadores:[]}, {color:'rojo', jugadores:[]}]};
    renderRosterEditor(extraccionActual);
    actualizarBotonGuardar();
  }
});

function comprimirImagenBlob(file, maxWidth, calidad){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('No se pudo comprimir la imagen')), 'image/jpeg', calidad);
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function llamarExtraccion(payload){
  if(!supabaseListo()) throw new Error('Sin conexión a Supabase');
  const { data, error } = await supabaseClient.functions.invoke('extraer-alineacion', { body: payload });
  if(error) throw error;
  if(data && data.error) throw new Error(data.error);
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if(!textBlock) throw new Error('Sin respuesta de texto');
  const clean = textBlock.text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

async function extraerAlineacion(payload){
  const statusEl = document.getElementById('status');
  statusEl.style.display = 'flex';
  statusEl.innerHTML = '<div class="spinner"></div> Leyendo la alineación de la imagen...';
  document.getElementById('roster-editor').style.display = 'none';

  try{
    const parsed = await llamarExtraccion(payload);
    extraccionActual = parsed;
    statusEl.innerHTML = '✅ Alineación leída. Revisa y corrige si hace falta.';
    renderRosterEditor(parsed);
  }catch(err){

    statusEl.innerHTML = '⚠️ No se pudo leer automáticamente. Añade los jugadores a mano abajo.';
    extraccionActual = {equipos:[{color:'azul', jugadores:[]}, {color:'rojo', jugadores:[]}]};

}

function crearFilaJugador(ei, ji, jugador){
  const row = document.createElement('div');
  row.className = 'prow';
  row.innerHTML = `
    <input type="text" value="${escapeHtml(jugador.nombre)}" placeholder="Nombre">
    <select>
      <option value="portero" ${jugador.posicion==='portero'?'selected':''}>Portero</option>
      <option value="defensa" ${jugador.posicion==='defensa'?'selected':''}>Defensa</option>
      <option value="medio" ${jugador.posicion==='medio'?'selected':''}>Medio</option>
      <option value="delantero" ${jugador.posicion==='delantero'?'selected':''}>Delantero</option>
    </select>
    <button title="Quitar">✕</button>`;
  const [inputEl, selectEl, btnEl] = row.children;
  inputEl.addEventListener('input', ()=> jugador.nombre = inputEl.value);
  selectEl.addEventListener('change', ()=> jugador.posicion = selectEl.value);
  btnEl.addEventListener('click', ()=>{
    const equipo = extraccionActual.equipos[ei];
    equipo.jugadores.splice(ji, 1);

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- Detección de cambios respecto a versión anterior ---------- */
function todosLosJugadores(data){
  return data.equipos.flatMap(e => e.jugadores.map(j => j.nombre.trim())).filter(Boolean);
}

document.getElementById('f-fecha').addEventListener('change', async ()=>{
  await cargarDesdeSupabase();
  chequearVersionAnterior();
});

function chequearVersionAnterior(){
  const fecha = document.getElementById('f-fecha').value;
  const partido = partidos.find(p => p.fecha === fecha);
  const diffBox = document.getElementById('diff-editor');
  diffBox.innerHTML = '';
  cambiosPropuestos = [];
  if(!partido || !extraccionActual) return;

  const anterior = partido.alineaciones.find(a => a.valida);
  if(!anterior) return;

  const nombresAntes = new Set(anterior.jugadores.map(j=>j.nombre));
  const nombresAhora = new Set(todosLosJugadores(extraccionActual));
  const bajas = [...nombresAntes].filter(n => !nombresAhora.has(n));
  const altas = [...nombresAhora].filter(n => !nombresAntes.has(n));

  if(bajas.length === 0 && altas.length === 0) return;

  const box = document.createElement('div');
  box.className = 'diff-box';
  box.innerHTML = `<h3>⚠️ Ya existe una alineación para esta fecha — se detectaron cambios</h3>`;
  bajas.forEach((baja, i)=>{
    const alta = altas[i] || null;
    cambiosPropuestos.push({jugador_baja: baja, jugador_entra: alta});
    const row = document.createElement('div');
    row.className = 'sub-row';
    row.innerHTML = `<span class="out">${escapeHtml(baja)}</span><span class="arrow">→</span>
      <span class="in">${alta ? escapeHtml(alta) : '(sin sustituto)'}</span>`;
    box.appendChild(row);
  });
  // altas sobrantes sin baja emparejada (equipo creció)
  altas.slice(bajas.length).forEach(alta=>{
    const row = document.createElement('div');
    row.className = 'sub-row';
    row.innerHTML = `<span class="arrow">Nueva incorporación:</span> <span class="in">${escapeHtml(alta)}</span>`;
    box.appendChild(row);
  });
  const note = document.createElement('p');
  note.style.cssText = 'font-size:12px;color:var(--text-dim);margin:10px 0 0;';
  note.textContent = 'Al guardar, esta versión anterior quedará marcada como no válida.';
  box.appendChild(note);
  diffBox.appendChild(box);
}

/* re-chequear diffs cuando cambian los nombres tras la extracción */
const observer = new MutationObserver(chequearVersionAnterior);
observer.observe(document.getElementById('roster-editor'), {childList:true, subtree:true});

/* ---------- Guardar partido ---------- */
function actualizarBotonGuardar(){
  document.getElementById('btn-guardar').disabled = !extraccionActual;
}

document.getElementById('btn-guardar').addEventListener('click', async ()=>{
  if(!supabaseListo()) return;
  const fecha = document.getElementById('f-fecha').value;
  const textoConv = document.getElementById('f-convocatoria').value.trim();
  if(!fecha){ toast('Falta la fecha'); return; }
  if(!extraccionActual){ toast('Falta la alineación'); return; }

  const jugadoresPlano = extraccionActual.equipos.flatMap(e =>
    e.jugadores.filter(j=>j.nombre.trim()).map(j => ({nombre:j.nombre.trim(), posicion:j.posicion, equipo:e.color}))
  );

  const btnGuardar = document.getElementById('btn-guardar');
  btnGuardar.disabled = true;
  btnGuardar.textContent = 'Guardando...';

  const partidoExistente = partidos.find(p => p.fecha === fecha);

  const valGolesAzul = document.getElementById('f-goles-azul').value;
  const valGolesRojo = document.getElementById('f-goles-rojo').value;
  const golesAzul = valGolesAzul !== '' ? parseInt(valGolesAzul, 10) : (partidoExistente ? partidoExistente.resultado.golesAzul : null);
  const golesRojo = valGolesRojo !== '' ? parseInt(valGolesRojo, 10) : (partidoExistente ? partidoExistente.resultado.golesRojo : null);

  const { error: errPartido } = await supabaseClient.from('partidos').upsert({
    id: fecha,
    fecha: fecha,
    convocatoria_texto: textoConv || (partidoExistente ? partidoExistente.convocatoria.texto : ''),
    convocatoria_fecha_mensaje: new Date().toISOString(),
    es_borrador: true,
    goles_azul: golesAzul,
    goles_rojo: golesRojo
  }, { onConflict: 'id' });

  if(errPartido){ console.error(errPartido); toast('Error guardando el partido'); btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar partido'; return; }

  const nuevaVersion = partidoExistente
    ? Math.max(...partidoExistente.alineaciones.map(a=>a.version), 0) + 1
    : 1;
  const alineacionId = `${fecha}-v${nuevaVersion}`;

  // La tabla "alineaciones" tiene un trigger que invalida automáticamente
  // la versión anterior vigente del mismo partido al insertar esta.
  const { error: errAlineacion } = await supabaseClient.from('alineaciones').insert({
    id: alineacionId,
    partido_id: fecha,
    version: nuevaVersion,
    valida: true,
    fecha_mensaje: new Date().toISOString(),
    imagen_url: imagenUrlPendiente
  });

  if(errAlineacion){ console.error(errAlineacion); toast('Error guardando la alineación'); btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar partido'; return; }

  if(jugadoresPlano.length){
    const { error: errJug } = await supabaseClient.from('jugadores_alineacion').insert(
      jugadoresPlano.map(j => ({alineacion_id: alineacionId, nombre: j.nombre, posicion: j.posicion, equipo: j.equipo}))
    );
    if(errJug) console.error(errJug);
  }

  if(cambiosPropuestos.length){
    const { error: errCambios } = await supabaseClient.from('cambios').insert(
      cambiosPropuestos.map(c => ({alineacion_id: alineacionId, jugador_baja: c.jugador_baja, jugador_entra: c.jugador_entra}))
    );
    if(errCambios) console.error(errCambios);
  }

  await cargarDesdeSupabase();
  toast('Partido guardado ✅');
  btnGuardar.disabled = false;
  btnGuardar.textContent = 'Guardar partido';
  resetFormulario();
});

      const btnBorrarVersion = document.createElement('button');

      btnBorrarVersion.style.color = '#e08787';
      btnBorrarVersion.textContent = '🗑 Eliminar versión';

        img.src = a.imagen_url;
        img.alt = `Alineación v${a.version}`;
        vDiv.appendChild(img);

      if(a.cambios_respecto_anterior && a.cambios_respecto_anterior.length){
        const diffBox = document.createElement('div');
        diffBox.className = 'diff-box';
        diffBox.style.marginTop = '8px';
        a.cambios_respecto_anterior.forEach(c=>{
          diffBox.innerHTML += `<div class="sub-row"><span class="out">${escapeHtml(c.jugador_baja)}</span><span class="arrow">→</span><span class="in">${c.jugador_entra ? escapeHtml(c.jugador_entra) : '(sin sustituto)'}</span></div>`;

function extraerPathStorage(url){
  if(!url) return null;
  const marcador = '/storage/v1/object/public/alineaciones/';
  const idx = url.indexOf(marcador);
  return idx === -1 ? null : url.slice(idx + marcador.length);
}

async function eliminarVersion(p, a){
  if(!confirm(`¿Eliminar la versión v${a.version} del ${p.fecha}? Esta acción no se puede deshacer.`)) return;
  if(!supabaseListo()) return;
  const ruta = extraerPathStorage(a.imagen_url);
  if(ruta) await supabaseClient.storage.from('alineaciones').remove([ruta]);
  const { error } = await supabaseClient.from('alineaciones').delete().eq('id', a.id);
  if(error){ console.error(error); toast('Error eliminando la versión'); return; }
  await cargarDesdeSupabase();
  toast('Versión eliminada');
  renderHistorial();
}

async function eliminarDia(p){
  if(!confirm(`¿Eliminar TODO el partido del ${p.fecha}, incluidas todas sus versiones de alineación? Esta acción no se puede deshacer.`)) return;
  if(!supabaseListo()) return;
  const rutas = p.alineaciones.map(a => extraerPathStorage(a.imagen_url)).filter(Boolean);
  if(rutas.length) await supabaseClient.storage.from('alineaciones').remove(rutas);
  const { error } = await supabaseClient.from('partidos').delete().eq('id', p.id);
  if(error){ console.error(error); toast('Error eliminando el partido'); return; }
  await cargarDesdeSupabase();
  toast('Día eliminado');
  renderHistorial();
}

function agruparPorEquipo(jugadores){
  const mapa = new Map();
  (jugadores||[]).forEach(j=>{
    const key = j.equipo || 'otro';
    if(!mapa.has(key)) mapa.set(key, []);
    mapa.get(key).push({nombre:j.nombre, posicion:j.posicion});
  });
  if(mapa.size === 0){ mapa.set('azul', []); mapa.set('rojo', []); }
  return {equipos: [...mapa.entries()].map(([color, jugadores])=>({color, jugadores}))};
}

function crearEditorEquiposHistorial(data, contenedor){
  contenedor.innerHTML = '';
  data.equipos.forEach(equipo=>{
    const block = document.createElement('div');
    block.className = 'team-block';
    const dotClass = equipo.color === 'azul' ? 'blue' : (equipo.color === 'rojo' ? 'red' : 'other');
    block.innerHTML = `<div class="team-head"><span class="dot ${dotClass}"></span><span>Equipo ${escapeHtml(equipo.color||'')}</span></div>
      <div class="prows"></div>
      <button class="ghost" type="button">+ Añadir jugador</button>`;
    contenedor.appendChild(block);
    const rowsWrap = block.querySelector('.prows');
    equipo.jugadores.forEach((j, ji)=>{
      const row = document.createElement('div');
      row.className = 'prow';
      row.innerHTML = `
        <input type="text" value="${escapeHtml(j.nombre)}" placeholder="Nombre">
        <select>
          <option value="portero" ${j.posicion==='portero'?'selected':''}>Portero</option>
          <option value="defensa" ${j.posicion==='defensa'?'selected':''}>Defensa</option>
          <option value="medio" ${j.posicion==='medio'?'selected':''}>Medio</option>
          <option value="delantero" ${j.posicion==='delantero'?'selected':''}>Delantero</option>
        </select>

async function guardarJugadoresVersion(contenedor, alineacion, data, btnGuardar){
  if(!supabaseListo()) return;
  btnGuardar.disabled = true;
  btnGuardar.textContent = 'Guardando...';

  const jugadoresPlano = data.equipos.flatMap(e =>
    e.jugadores.filter(j=>j.nombre.trim()).map(j => ({nombre:j.nombre.trim(), posicion:j.posicion, equipo:e.color}))
  );

  await supabaseClient.from('jugadores_alineacion').delete().eq('alineacion_id', alineacion.id);
  if(jugadoresPlano.length){
    const { error } = await supabaseClient.from('jugadores_alineacion').insert(
      jugadoresPlano.map(j => ({alineacion_id: alineacion.id, nombre: j.nombre, posicion: j.posicion, equipo: j.equipo}))
    );
    if(error){ console.error(error); toast('Error guardando los cambios'); btnGuardar.disabled = false; btnGuardar.textContent = '💾 Guardar cambios'; return; }
  }

  alineacion.jugadores = jugadoresPlano;
  await cargarDesdeSupabase();
  toast('Jugadores actualizados ✅');
  pintarJugadoresVersion(contenedor, alineacion);
}

async function guardarEstadisticasPartido(contenedor, partido, filas, btnGuardar){

  const { error } = await supabaseClient.from('estadisticas_partido_jugador').upsert(
    filas.map(f => ({

      goles: f.goles,
      tarjeta_amarilla: f.tarjetaAmarilla,
      tarjeta_roja: f.tarjetaRoja

/* ---------- Generar libro en PDF (un partido por página) ---------- */

// Las fuentes estándar de jsPDF (helvetica) no pueden dibujar emojis: se ven
// como huecos en blanco o cajas vacías. Los quitamos del texto antes de
// meterlo en el PDF (en la app normal sí se ven, esto solo afecta al libro).
function limpiarParaPDF(texto){
  if(!texto) return '';
  return texto
    .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{25A0}-\u{25FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{2000}-\u{206F}]/gu, '')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}

const ORDEN_POSICION = {portero:0, defensa:1, medio:2, delantero:3};
const ETIQUETA_POSICION = {portero:'POR', defensa:'DEF', medio:'MED', delantero:'DEL'};

function ordenarJugadoresPDF(jugadores){
  return [...(jugadores||[])].sort((a,b)=> (ORDEN_POSICION[a.posicion] ?? 9) - (ORDEN_POSICION[b.posicion] ?? 9));
}

// Pinta el detalle de jugadores de un equipo: nombre + puesto en la primera
// línea, y minutos/goles/tarjetas en una segunda línea más pequeña (texto
// plano, sin emoji, porque las fuentes estándar de jsPDF no los dibujan).
// Devuelve la altura en mm que ha ocupado.
function pintarColumnaEquipoPDF(doc, jugadores, x, y, ancho, colorRGB, etiqueta){
  let yy = y;
  doc.setFillColor(...colorRGB);
  doc.circle(x + 1.3, yy - 1.2, 1.3, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(60);
  doc.text(etiqueta, x + 5, yy);
  yy += 5.5;
  ordenarJugadoresPDF(jugadores).forEach(j=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(40);
    const nombre = doc.splitTextToSize(j.nombre || '', ancho - 12)[0] || '';
    doc.text(nombre, x, yy);
    const pos = ETIQUETA_POSICION[j.posicion] || '';
    if(pos){
      doc.setTextColor(150);
      doc.setFontSize(7.5);
      doc.text(pos, x + ancho, yy, {align:'right'});
    }
    yy += 4;

    const detalle = [];
    if(j.minutosJugados !== undefined && j.minutosJugados !== null) detalle.push(`${j.minutosJugados}'`);
    if(j.goles) detalle.push(j.goles === 1 ? '1 gol' : `${j.goles} goles`);
    if(j.tarjetaAmarilla) detalle.push('TA');
    if(j.tarjetaRoja) detalle.push('TR');
    if(detalle.length){
      doc.setFont('helvetica','normal'); doc.setFontSize(7.3);
      doc.setTextColor(j.tarjetaRoja ? 190 : (j.goles ? 40 : 140), j.tarjetaRoja ? 60 : (j.goles ? 120 : 140), j.tarjetaRoja ? 60 : (j.goles ? 70 : 140));
      doc.text(detalle.join('  ·  '), x, yy);
      yy += 3.6;
    }
    yy += 1.2;
  });
  return yy - y;
}

function urlAImagenBase64(url){
  return fetch(url)
    .then(res => { if(!res.ok) throw new Error('No se pudo descargar la imagen'); return res.blob(); })
    .then(blob => new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    }));
}

function medirImagen(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=> resolve({width:img.width, height:img.height});
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function generarLibroPDF(){
  const btn = document.getElementById('btn-generar-libro');
  const statusLibro = document.getElementById('status-libro');
  if(!window.jspdf){ toast('No se pudo cargar la librería de PDF'); return; }

  btn.disabled = true;
  statusLibro.style.display = 'flex';
  statusLibro.innerHTML = '<div class="spinner"></div> Generando el libro...';

  try{
    await cargarDesdeSupabase();

    const ordenados = [...partidos].sort((a,b)=> a.fecha < b.fecha ? -1 : 1); // más antiguo primero
    // Incluye cualquier partido con convocatoria o alguna alineación, no solo los que tengan
    // una versión marcada como "vigente" (los importados del histórico pueden no tenerla).
    const paginas = ordenados
      .filter(p => (p.convocatoria.texto && p.convocatoria.texto.trim()) || p.alineaciones.length)
      .map(p => {
        const vigente = p.alineaciones.find(a => a.valida)
          || [...p.alineaciones].sort((a,b) => b.version - a.version)[0]
          || null;
        return { p, vigente };
      });

    if(paginas.length === 0){
      toast('No hay partidos con datos para incluir en el libro');
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 18;

    for(let i=0; i<paginas.length; i++){
      const { p, vigente } = paginas[i];
      if(i > 0) doc.addPage();
      let y = margin;

      statusLibro.innerHTML = `<div class="spinner"></div> Preparando página ${i+1}/${paginas.length}...`;

      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(130);
      doc.text('FÚTBOL JUEVES MUNDIAL', margin, y);
      y += 8;

      const fechaFmt = new Date(p.fecha + 'T00:00:00').toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
      const fechaCap = fechaFmt.charAt(0).toUpperCase() + fechaFmt.slice(1);
      doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(20);
      doc.text(fechaCap, margin, y);
      y += 9;

      const statsPartidoPagina = estadisticasEfectivasPartido(p);

      if(p.resultado.golesAzul !== null && p.resultado.golesRojo !== null){
        doc.setFillColor(53,104,196);
        doc.circle(margin+1.5, y-1.7, 1.8, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20);
        const texto = `${p.resultado.golesAzul}  –  ${p.resultado.golesRojo}`;
        doc.text(texto, margin+6, y);
        const ancho = doc.getTextWidth(texto);
        doc.setFillColor(194,59,59);
        doc.circle(margin+6+ancho+3.5, y-1.7, 1.8, 'F');
        y += 6.5;

        const goleadoresPagina = statsPartidoPagina.filter(j => j.goles > 0).sort((a,b)=>b.goles-a.goles);
        if(goleadoresPagina.length){
          const textoGoleadores = 'Goles: ' + goleadoresPagina.map(g => g.goles > 1 ? `${g.nombre} (${g.goles})` : g.nombre).join(', ');
          doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(110);
          const lineasG = doc.splitTextToSize(textoGoleadores, pageWidth - margin*2);
          doc.text(lineasG, margin, y);
          y += lineasG.length * 4;
        }
        y += 3.5;
      }

      const convocatoriaLimpia = limpiarParaPDF(p.convocatoria.texto);
      if(convocatoriaLimpia){
        doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(90);
        const lineas = doc.splitTextToSize(convocatoriaLimpia, pageWidth - margin*2);
        doc.text(lineas, margin, y);
        y += lineas.length * 4.8 + 6;
      } else {
        doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.setTextColor(160);
        doc.text('(Sin texto de convocatoria)', margin, y);
        y += 8;
      }

      const cambios = (vigente && vigente.cambios_respecto_anterior) ? vigente.cambios_respecto_anterior : [];
      const altoBloqueCambios = cambios.length ? (13 + cambios.length * 6 + 4) : 0;

      // Foto de la alineación: más pequeña (columna izquierda) para dejar
      // sitio al detalle de jugadores (puesto, minutos, goles, tarjetas) a
      // la derecha. Se usan TODOS los jugadores que aparecieron en alguna
      // versión del partido (no solo la vigente), para no perder a quien
      // fue sustituido a mitad de partido.
      const jugadoresAzul = statsPartidoPagina.filter(j => j.equipo === 'azul');
      const jugadoresRojo = statsPartidoPagina.filter(j => j.equipo === 'rojo');
      const hayRoster = statsPartidoPagina.length > 0;

      const anchoTotal = pageWidth - margin*2;
      const anchoImagen = hayRoster ? anchoTotal * 0.42 : anchoTotal;
      const anchoRoster = anchoTotal - anchoImagen - 8;
      const yInicioBloque = y;
      let alturaImagen = 0;

      if(vigente && vigente.imagen_url){
        try{
          const dataUrl = await urlAImagenBase64(vigente.imagen_url);
          const dims = await medirImagen(dataUrl);
          const maxW = anchoImagen;
          const maxH = Math.min(80, pageHeight - y - 18 - altoBloqueCambios - (altoBloqueCambios ? 8 : 0));
          let w = maxW, h = w * (dims.height/dims.width);
          if(h > maxH){ h = maxH; w = h * (dims.width/dims.height); }
          const x = margin + (maxW - w)/2;
          doc.addImage(dataUrl, 'JPEG', x, y, w, h);
          alturaImagen = h;
        }catch(err){
          console.error('No se pudo insertar la imagen en el PDF', err);
          doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(150);
          const lineasErr = doc.splitTextToSize('(No se pudo cargar la imagen de esta alineación)', anchoImagen);
          doc.text(lineasErr, margin, y + 5);
          alturaImagen = lineasErr.length * 4.8;
        }
      } else if(!hayRoster){
        doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.setTextColor(160);
        doc.text('(Sin foto ni jugadores registrados para este día)', margin, y);
        alturaImagen = 6;
      }

      let alturaRoster = 0;
      if(hayRoster){
        const xRoster = margin + anchoImagen + 8;
        const alturaAzul = pintarColumnaEquipoPDF(doc, jugadoresAzul, xRoster, y + 4, anchoRoster, [53,104,196], 'EQUIPO AZUL');
        const alturaRojo = pintarColumnaEquipoPDF(doc, jugadoresRojo, xRoster, y + 4 + alturaAzul + 6, anchoRoster, [194,59,59], 'EQUIPO ROJO');
        alturaRoster = 4 + alturaAzul + 6 + alturaRojo;
      }

      y = yInicioBloque + Math.max(alturaImagen, alturaRoster) + 8;

      // Bloque visual de bajas y sustituciones
      if(cambios.length){
        doc.setFillColor(255,248,232);
        doc.setDrawColor(226,166,59);
        doc.roundedRect(margin, y, pageWidth - margin*2, altoBloqueCambios, 2.5, 2.5, 'FD');
        let yc = y + 8;
        doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(160,110,30);
        doc.text('Bajas y sustituciones de esta jornada', margin + 5, yc);
        yc += 6.5;
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
        cambios.forEach(c=>{
          doc.setTextColor(190,60,60);
          doc.text(c.jugador_baja, margin + 5, yc);
          const anchoBaja = doc.getTextWidth(c.jugador_baja);
          doc.setTextColor(120,120,120);
          doc.text('  ->  ', margin + 5 + anchoBaja, yc);
          const anchoFlecha = doc.getTextWidth('  ->  ');
          doc.setTextColor(40,120,70);
          doc.text(c.jugador_entra || '(sin sustituto)', margin + 5 + anchoBaja + anchoFlecha, yc);
          yc += 6;
        });
        y += altoBloqueCambios + 8;
      }

      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(160);
      doc.text(`${i+1} / ${paginas.length}`, pageWidth/2, pageHeight-10, {align:'center'});
    }

    doc.save('futbol-jueves-mundial.pdf');
    toast('Libro generado ✅');
  }catch(err){
    console.error(err);
    toast('Error generando el libro');
  }finally{
    btn.disabled = false;
    statusLibro.style.display = 'none';
  }
}

document.getElementById('btn-generar-libro').addEventListener('click', generarLibroPDF);

/* ---------- Importar / exportar JSON (para la carga histórica) ---------- */
document.getElementById('btn-export').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(partidos, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'alineaciones-backup.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-import').addEventListener('click', ()=> document.getElementById('f-import').click());
document.getElementById('f-import').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(!supabaseListo()){ e.target.value = ''; return; }
  const btnImport = document.getElementById('btn-import');
  try{
    const texto = await file.text();
    const importados = JSON.parse(texto);
    if(!Array.isArray(importados)) throw new Error('Formato inválido');

    btnImport.disabled = true;
    btnImport.textContent = `Importando 0/${importados.length}...`;

    for(let i=0; i<importados.length; i++){
      const p = importados[i];
      btnImport.textContent = `Importando ${i+1}/${importados.length}...`;

      await supabaseClient.from('partidos').upsert({
        id: p.fecha,
        fecha: p.fecha,
        convocatoria_texto: p.convocatoria?.texto || '',
        convocatoria_fecha_mensaje: p.convocatoria?.fecha_mensaje || new Date().toISOString(),
        es_borrador: true,
        goles_azul: p.resultado?.golesAzul ?? null,
        goles_rojo: p.resultado?.golesRojo ?? null
      }, { onConflict: 'id' });

      for(const a of (p.alineaciones || [])){
        const alineacionId = a.id || `${p.fecha}-v${a.version}`;
        await supabaseClient.from('alineaciones').upsert({
          id: alineacionId,
          partido_id: p.fecha,
          version: a.version,
          valida: !!a.valida,
          fecha_mensaje: a.fecha_mensaje || new Date().toISOString(),
          imagen_path: a.imagen_path || null
        }, { onConflict: 'id' });

        // idempotente: si se reimporta el mismo fichero, no se duplican jugadores/cambios
        await supabaseClient.from('jugadores_alineacion').delete().eq('alineacion_id', alineacionId);
        if((a.jugadores || []).length){
          await supabaseClient.from('jugadores_alineacion').insert(
            a.jugadores.map(j => ({alineacion_id: alineacionId, nombre: j.nombre, posicion: j.posicion || '', equipo: j.equipo || ''}))
          );
        }

        await supabaseClient.from('cambios').delete().eq('alineacion_id', alineacionId);
        if((a.cambios_respecto_anterior || []).length){
          await supabaseClient.from('cambios').insert(
            a.cambios_respecto_anterior.map(c => ({alineacion_id: alineacionId, jugador_baja: c.jugador_baja, jugador_entra: c.jugador_entra}))
          );
        }
      }
    }

    await cargarDesdeSupabase();
    toast(`Importados ${importados.length} partidos`);
    renderHistorial();
  }catch(err){
    toast('Error al importar el JSON');
    console.error(err);
  } finally {
    btnImport.disabled = false;
    btnImport.textContent = '⬆ Importar JSON';
    e.target.value = '';
  }
});

/* ---------- Carga inicial ---------- */
cargarDesdeSupabase();
</script>
</body>
